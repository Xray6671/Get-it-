name: Deploy site to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    # GitHub adds a branch rule to the default "github-pages" environment that
    # kept refusing main. A separately named environment has no such rule.
    environment:
      name: site
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      # Publish only the website. The database schema (which holds the quiz
      # answer key), tests, README and workflow files stay out of the site.
      - name: Collect site files
        run: |
          mkdir _site
          git ls-files -z | grep -zv -e '^supabase/' -e '^\.github/' -e '^README\.md$' \
            | xargs -0 cp --parents -t _site
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
